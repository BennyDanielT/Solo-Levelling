services:
  mongodb:
    image: mongo:4.4
    container_name: solo-leveling-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--username", "${MONGO_ROOT_USER}", "--password", "${MONGO_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - solo-leveling-network

  mongo-express:
    image: mongo-express:1.0.0
    container_name: solo-leveling-mongo-ui
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_URL: "mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/"
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_ROOT_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    networks:
      - solo-leveling-network

  fastapi:
    build:
      context: ./ai-agent-service
      dockerfile: Dockerfile
    container_name: solo-leveling-fastapi
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      DATABASE_URL: "mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/solo_levelling?authSource=admin"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AZURE_AI_PROJECT_ENDPOINT: ${AZURE_AI_PROJECT_ENDPOINT:-}
      AZURE_EXISTING_AGENT_ID: ${AZURE_EXISTING_AGENT_ID:-}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      # Azure Service Principal authentication
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID:-}
    ports:
      - "8000:8000"
    volumes:
      - ./ai-agent-service:/app
      # Mount Azure CLI credentials from host for DefaultAzureCredential
      - ${HOME}/.azure:/root/.azure:ro
    networks:
      - solo-leveling-network

  ollama:
    image: ollama/ollama:latest
    container_name: solo-leveling-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - solo-leveling-network
    # Optional: GPU support (uncomment if you have NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  n8n:
    image: n8nio/n8n:latest
    container_name: solo-leveling-n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=${N8N_HOST:-n8n.maxeffortgazette.com}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://${N8N_HOST:-n8n.maxeffortgazette.com}/
      - GENERIC_TIMEZONE=${TIMEZONE:-America/New_York}
    ports:
      - "5678:5678"
    volumes:
      - ./n8n-data:/home/node/.n8n
    networks:
      - solo-leveling-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev       # Use the dev stage for hot reload
    container_name: solo-leveling-app
    restart: unless-stopped
    depends_on:
      fastapi:
        condition: service_started
      mongodb:
        condition: service_healthy
    environment:
      FASTAPI_SERVICE_URL: "http://fastapi:8000"
      NODE_ENV: development
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      DATABASE_URL: "mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/solo_levelling?authSource=admin"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - ./:/app        # Mount project for hot reload
      - /app/node_modules
    networks:
      - solo-leveling-network

volumes:
  mongodb_data:
    driver: local
  ollama_data:
    driver: local

networks:
  solo-leveling-network:
    driver: bridge
