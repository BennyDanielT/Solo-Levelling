  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev       # Use the dev stage for hot reload
    container_name: solo-leveling-app
    restart: unless-stopped
    # depends_on:
    #   - fastapi
    environment:
      FASTAPI_SERVICE_URL: "http://localhost:8000"
      NODE_ENV: development
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    ports:
      - "3000:3000"
    volumes:
      - ./:/app        # Mount project for hot reload
      - /app/node_modules
    networks:
      - solo-leveling-network

volumes:
  mongodb_data:
    driver: local

networks:
  solo-leveling-network:
    driver: bridge
