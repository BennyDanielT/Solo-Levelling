name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_CONTAINER_REGISTRY: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
  RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  CONTAINER_APP_ENVIRONMENT: ${{ secrets.AZURE_CONTAINER_APP_ENVIRONMENT }}
  LOCATION: canadaeast

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push MongoDB image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.mongodb
          push: true
          tags: |
            ${{ secrets.AZURE_CONTAINER_REGISTRY }}/solo-leveling-mongodb:${{ github.sha }}
            ${{ secrets.AZURE_CONTAINER_REGISTRY }}/solo-leveling-mongodb:latest
          cache-from: type=registry,ref=${{ secrets.AZURE_CONTAINER_REGISTRY }}/solo-leveling-mongodb:latest
          cache-to: type=inline

      - name: Build and push FastAPI image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-agent-service
          file: Dockerfile.fastapi
          push: true
          tags: |
            ${{ secrets.AZURE_CONTAINER_REGISTRY }}/solo-leveling-fastapi:${{ github.sha }}
            ${{ secrets.AZURE_CONTAINER_REGISTRY }}/solo-leveling-fastapi:latest
          cache-from: type=registry,ref=${{ secrets.AZURE_CONTAINER_REGISTRY }}/solo-leveling-fastapi:latest
          cache-to: type=inline

      - name: Build and push Next.js image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.AZURE_CONTAINER_REGISTRY }}/solo-leveling-nextjs:${{ github.sha }}
            ${{ secrets.AZURE_CONTAINER_REGISTRY }}/solo-leveling-nextjs:latest
          cache-from: type=registry,ref=${{ secrets.AZURE_CONTAINER_REGISTRY }}/solo-leveling-nextjs:latest
          cache-to: type=inline

      - name: Deploy to Azure Container Apps
        uses: azure/CLI@v1
        with:
          inlineScript: |
            # Check if container apps exist
            MONGODB_EXISTS=$(az containerapp show --name solo-leveling-mongodb --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} 2>/dev/null && echo "true" || echo "false")
            FASTAPI_EXISTS=$(az containerapp show --name solo-leveling-fastapi --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} 2>/dev/null && echo "true" || echo "false")
            NEXTJS_EXISTS=$(az containerapp show --name solo-leveling-nextjs --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} 2>/dev/null && echo "true" || echo "false")

            # Deploy MongoDB
            if [ "$MONGODB_EXISTS" = "false" ]; then
              echo "Creating MongoDB container app..."
              az containerapp create \
                --name solo-leveling-mongodb \
                --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
                --environment ${{ secrets.AZURE_CONTAINER_APP_ENVIRONMENT }} \
                --image ${{ secrets.AZURE_CONTAINER_REGISTRY }}/solo-leveling-mongodb:latest \
                --target-port 27017 \
                --transport tcp \
                --ingress internal \
                --min-replicas 1 \
                --max-replicas 1 \
                --cpu 1.0 \
                --memory 2Gi \
                --env-vars \
                  MONGO_INITDB_ROOT_USERNAME=${{ secrets.MONGO_ROOT_USERNAME }} \
                  MONGO_INITDB_ROOT_PASSWORD=${{ secrets.MONGO_ROOT_PASSWORD }} \
                  MONGO_INITDB_DATABASE=solo_leveling \
                --registry-server ${{ secrets.AZURE_CONTAINER_REGISTRY }} \
                --registry-username ${{ secrets.ACR_USERNAME }} \
                --registry-password ${{ secrets.ACR_PASSWORD }}
            else
              echo "Updating MongoDB container app..."
              az containerapp update \
                --name solo-leveling-mongodb \
                --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
                --image ${{ secrets.AZURE_CONTAINER_REGISTRY }}/solo-leveling-mongodb:${{ github.sha }}
            fi

            # Deploy FastAPI
            if [ "$FASTAPI_EXISTS" = "false" ]; then
              echo "Creating FastAPI container app..."
              az containerapp create \
                --name solo-leveling-fastapi \
                --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
                --environment ${{ secrets.AZURE_CONTAINER_APP_ENVIRONMENT }} \
                --image ${{ secrets.AZURE_CONTAINER_REGISTRY }}/solo-leveling-fastapi:latest \
                --target-port 8000 \
                --ingress external \
                --min-replicas 1 \
                --max-replicas 3 \
                --cpu 0.5 \
                --memory 1Gi \
                --env-vars \
                  MONGODB_URL=${{ secrets.MONGODB_URL }} \
                  NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }} \
                  GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
                  GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }} \
                  NEWS_API_KEY=${{ secrets.NEWS_API_KEY }} \
                  NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }} \
                --registry-server ${{ secrets.AZURE_CONTAINER_REGISTRY }} \
                --registry-username ${{ secrets.ACR_USERNAME }} \
                --registry-password ${{ secrets.ACR_PASSWORD }}
            else
              echo "Updating FastAPI container app..."
              az containerapp update \
                --name solo-leveling-fastapi \
                --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
                --image ${{ secrets.AZURE_CONTAINER_REGISTRY }}/solo-leveling-fastapi:${{ github.sha }} \
                --set-env-vars \
                  MONGODB_URL=${{ secrets.MONGODB_URL }} \
                  NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }} \
                  GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
                  GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }} \
                  NEWS_API_KEY=${{ secrets.NEWS_API_KEY }} \
                  NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
            fi

            # Get FastAPI internal URL
            FASTAPI_URL=$(az containerapp show \
              --name solo-leveling-fastapi \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --query properties.configuration.ingress.fqdn \
              -o tsv)

            # Deploy Next.js
            if [ "$NEXTJS_EXISTS" = "false" ]; then
              echo "Creating Next.js container app..."
              az containerapp create \
                --name solo-leveling-nextjs \
                --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
                --environment ${{ secrets.AZURE_CONTAINER_APP_ENVIRONMENT }} \
                --image ${{ secrets.AZURE_CONTAINER_REGISTRY }}/solo-leveling-nextjs:latest \
                --target-port 3000 \
                --ingress external \
                --min-replicas 1 \
                --max-replicas 5 \
                --cpu 0.5 \
                --memory 1Gi \
                --env-vars \
                  NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }} \
                  NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }} \
                  GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
                  GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }} \
                  NEXT_PUBLIC_FASTAPI_URL=https://${FASTAPI_URL} \
                  FASTAPI_SERVICE_URL=https://${FASTAPI_URL} \
                --registry-server ${{ secrets.AZURE_CONTAINER_REGISTRY }} \
                --registry-username ${{ secrets.ACR_USERNAME }} \
                --registry-password ${{ secrets.ACR_PASSWORD }}
            else
              echo "Updating Next.js container app..."
              az containerapp update \
                --name solo-leveling-nextjs \
                --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
                --image ${{ secrets.AZURE_CONTAINER_REGISTRY }}/solo-leveling-nextjs:${{ github.sha }} \
                --set-env-vars \
                  NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }} \
                  NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }} \
                  GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
                  GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }} \
                  NEXT_PUBLIC_FASTAPI_URL=https://${FASTAPI_URL} \
                  FASTAPI_SERVICE_URL=https://${FASTAPI_URL}
            fi

      - name: Get Application URL
        run: |
          APP_URL=$(az containerapp show \
            --name solo-leveling-nextjs \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn \
            -o tsv)
          echo "🚀 Application deployed successfully!"
          echo "🌐 Application URL: https://${APP_URL}"
